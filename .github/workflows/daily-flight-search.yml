name: Tägliche Flugpreissuche FRA-HND

on:
  schedule:
    # täglich um 06:00 UTC (= 07:00 bzw. 08:00 deutsche Zeit, je nach Sommerzeit)
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # erlaubt manuelles Starten über den "Run workflow"-Button

permissions:
  contents: write  # damit der Workflow die CSV zurück ins Repo committen darf

concurrency:
  group: flugsuche-push
  cancel-in-progress: false

jobs:
  suche:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Flugsuche ausführen
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python flugsuche.py

      - name: Ergebnisse committen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Preise vom ${{ github.run_id }}"
          commit_user_name: flugsuche-bot
          commit_user_email: actions@github.com
          file_pattern: data/preise.csv
          skip_dirty_check: false
